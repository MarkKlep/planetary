<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Planetary">
<!--
Planetary -- primary mark.

A direct evolution of public/favicon.svg, in the same three shapes and the
same tokens as variables.scss: --signal amber for the star (the one point
light every position in the scene is computed from), one orbit, one body on
it.  Three things the 16px favicon had no room for are added, and each is a
fact about the app rather than a flourish:

- The body carries a terminator, lit from the star's real direction.  Every
  surface in this project is shaded by a point light at the origin, so a
  phase is the whole claim in one shape.
- The orbit ramps dim-to-bright into the body, which is how
  iss-trajectory.ts draws an orbit -- the only thing that says which way
  round it is being flown.
- The star is limb-darkened from the centre out rather than shaded from
  one side.  planet-icons.tsx makes exactly this correction:
  a dark edge is a terminator, and a terminator is the one thing a star
  cannot have.
-->
  <defs>
    <radialGradient id="ground" cx="50%" cy="42%" r="74%">
      <stop offset="0%" stop-color="#15151a"/>
      <stop offset="62%" stop-color="#0c0c0f"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="photosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6dc"/>
      <stop offset="55%" stop-color="#ffc45e"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </radialGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffa54a" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#ff8a3d" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#ground)"/>
  <circle cx="200" cy="200" r="117" fill="url(#corona)"/>
    <circle cx="200" cy="200" r="45" fill="url(#photosphere)"/>
